services:
  postgres:
    image: postgres:18.6
    hostname: postgres
    environment:
      POSTGRES_DB: db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./src/main/resources/db/postgresql:/docker-entrypoint-initdb.d:ro
      - ./db:/var/lib/postgresql
    ports:
      - "5432:5432"
  rabbitmq:
    image: 'rabbitmq:4.3.5'
    ports:
      - '15672:15672'
      - '5672:5672'
  wiremock:
    image: 'wiremock/wiremock:3.13.2'
    ports:
      - "8081:8080"
    volumes:
      - ./src/main/resources/mappings:/home/wiremock/mappings:ro
      - ./__files:/home/wiremock/__files:ro
    command:
      - --verbose
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/__admin/health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: customer-keycloak
    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8082:8080"

    volumes:
      - ./src/main/resources/keycloak/customer-realm.json:/opt/keycloak/data/import/customer-realm.json:ro
